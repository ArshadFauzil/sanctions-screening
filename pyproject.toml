[project]
name = "sanctions-adjudicator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.39.0",
    "jellyfish>=1.2.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs Postgres with the sdn tables and sdn_names",
    "slow: exhaustive sweeps over the real list; run with -m slow",
]
addopts = '-m "not slow"'
